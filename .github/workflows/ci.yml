name: Secure Web CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build non-root Nginx image
        run: docker build --pull -t fast-secure-web:test .
      - name: Verify website and security headers
        run: |
          docker run --detach --name portfolio-web --read-only --cap-drop=ALL --security-opt no-new-privileges -p 8080:8080 fast-secure-web:test
          trap 'docker logs portfolio-web; docker rm -f portfolio-web' EXIT
          for i in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:8080/ | grep -q 'Fast by Design'; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/ | grep -q 'Fast by Design'
          curl --fail --silent --head http://127.0.0.1:8080/ | grep -qi 'Content-Security-Policy:'
          curl --fail --silent --head http://127.0.0.1:8080/ | grep -qi 'X-Content-Type-Options: nosniff'
